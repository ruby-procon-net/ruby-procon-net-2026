    message: ソニックガーデンは、Rubyを中心とするソフトウェア開発の会社です。プログラミングの楽しさを伝えるべく、昨年から小中学生向けプログラミング部「セタプロ」に全面協力しています。皆さんもぜひ楽しみながら作品をつくってください。
- tier: Platinum
  sponsors:
  - name: 株式会社セールスフォース・ジャパン
    logo: 2026/salesforce.webp
    url: https://www.salesforce.com/jp/
  - name: 株式会社SmartHR
    logo: 2026/smart-hr.svg
    url: https://smarthr.co.jp/
    message: みなさんがコードを書き、動かす瞬間には、大きな発見と可能性が広がっています。その感動や経験を積み重ねることは、好奇心を育み、未来の夢を形づくる力になるでしょう。SmartHRは、「well-working
      労働にまつわる社会課題をなくし、誰もがその人らしく働ける社会をつくる」ことを目指しています。みなさんがRubyの「楽しさ」とともにプログラミングを通じて新しい世界を切りひらき、自分らしく可能性を広げていくことを、心から応援しています。
- tier: Gold
  sponsors:
  - name: フィヨルドブートキャンプ
    logo: 2026/fbc.webp
    url: https://bootcamp.fjord.jp/
    message: |-
      フィヨルドブートキャンプは、プロのエンジニアを目指す仲間が集まり、互いに助け合い、切磋琢磨しながら学ぶオンラインのプログラミングスクールです。
      受講生たちは、Rubyを楽しみつつ、日々の開発や学習に取り組んでいます。
      今回のコンテストでも、みなさんがRubyを楽しんで形にしたアイデアに出会えることを、心から楽しみにしています。
  - name: 株式会社永和システムマネジメント
    logo: 2026/esm.webp
    url: https://agile.esm.co.jp
    message: |-
      アジャイルと Ruby が実現するソフトウェア開発は、開発者が「楽しさ」を感じられる開発であり、そこにはきっとビジネス価値がある――私たちはそう信じて行動を続けています。同じように、プログラミングを楽しくする Ruby を通じて実現される、みなさんの作品を楽しみにしています！
  - name: ピクシブ株式会社
    logo: 2026/pixiv.webp
    url: https://www.pixiv.co.jp/
    message: |-
      「好き」を形にするワクワク感、失敗すら楽しむ熱量、すべてが最高のコードになります。
      あふれる想いをRubyに込めて、あなたにしか作れない世界を魅せてください！
      挑戦するすべてのクリエイターを全力で応援しています！
