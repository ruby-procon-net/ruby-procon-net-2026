# クリエイティブコーディング部門の審査委員。
# まつもとゆきひろ氏を先頭に置き、ほかは五十音順。
- name: まつもとゆきひろ
  title: 一般財団法人Rubyアソシエーション 理事長
  bio: プログラミング言語Rubyの開発者。1993年から開発を開始。株式会社ネットワーク応用通信研究所フェロー。島根県松江市在住、松江市名誉市民。
  message: インターネットの発達で、若い人たちのコンピューターへの接し方が極端に二分化されました。ただ単にユーザーとしてコンピューターを利用する大多数の人たちと、プログラミングを通じてコンピューターの持つ無限の可能性を引き出す人たちです。本コンテストの参加者は貴重な後者です。
  photo: matz.webp

- name: 石田 智也
  title: 株式会社コードタクト
  bio: Rubyコミッター。奇妙なコードを書くのが好き。IOCCC（国際難読化Cコードコンテスト）およびTRICK（超絶技巧Ruby意味不明コンテスト）に複数回入賞。
  message: プログラムで表現できることって思っているよりも多様なんです。ぜひ色々な表現、色々な可能性を試行錯誤し、それを楽しみながら作品を作ってみてください。
  photo: ishida.webp

- name: 北村 幸紀
  title: 株式会社システムプロポーザル
  bio: 株式会社システムプロポーザル代表取締役。ボランティアとして中高生向けプログラミング講座の活動に参加。講座での諸々の課題を解消するため、2021年にrbCanvasおよびrbCanvas/p5を作成。
  message: 思いどおりの作品ができたり、思いもよらない作品ができたり、プログラミングは自由に楽しめるものだと思います。そして出来上がった作品をみんなに見てもらうことで、さらにその面白さを実感してみてください。
  photo: kitamura.webp

- name: 小芝 美由紀
  title: 株式会社スマートバンク
  bio: ソフトウェアエンジニア。「chobishiba」名義でRubyによるクリエイティブコーディング作品を制作。商業施設などで展示も行う。2025年、武蔵野美術大学通信教育課程デザイン情報学科卒業。
  message: プログラミングには、問題を解決するだけでなく、絵や動きをつくって楽しむ使い方もあります。円をひとつ描くところから、自分だけの世界を創ってみませんか。みなさんの作品を楽しみにしています。
  photo: koshiba.webp

- name: 町田 哲平
  title: 合同会社リピートスペース
  bio: 合同会社リピートスペース代表社員。デザイナー、ソフトウェア開発者。フィヨルドブートキャンプの立ち上げ・運営を経て、現在はメンター。Webサービスやビジュアルの企画・制作、AI活用の推進、教育に取り組む。
  message: クリエイティブコーディングには、決まった正解がありません。技術的なすごさだけでなく、自分が面白いと思ったことを形にすることにも価値があります。思いどおりに動かず、偶然生まれたものが面白いこともあります。そんな寄り道も楽しみながら試行錯誤してください。みなさんならではの作品を楽しみにしています。
  photo: machida.webp
